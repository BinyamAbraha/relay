name: Verify Relay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/setup.sh
      - run: make test lint
      - run: make demo
      - run: cd web && npx playwright install --with-deps chromium
      - run: make browser-test
      - run: make public-demo public-test
      - run: .venv/bin/python scripts/check_docs.py
