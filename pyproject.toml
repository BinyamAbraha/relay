[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-data-platform"
version = "0.1.0"
description = "Auditable order and inventory reporting with deterministic recovery demonstrations"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "duckdb", "pydantic"]

[project.scripts]
relay = "relay.cli:main"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
